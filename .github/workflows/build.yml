name: Build LostCities Paper

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Fase 5 ZIP
        run: unzip -o lostcities-paper-fase-5.zip

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.2

      - name: Run Tests & Build JAR
        working-directory: lostcities-paper
        run: gradle test build --info

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LostCities-Paper-Fase5
          path: lostcities-paper/build/libs/*.jar
